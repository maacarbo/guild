stages:
  - check

typecheck:
  stage: check
  image: node:22
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.34.5 --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm -r typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
