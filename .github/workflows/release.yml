# Release: on a version tag, publish the daemon and conductor images to GHCR
# (M2 ship gate: the quickstart pulls the daemon image instead of building).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: daemon image
        uses: docker/build-push-action@v6
        with:
          context: docker/daemon
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/guild-daemon:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/guild-daemon:latest
      - name: conductor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/conductor/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/guild-conductor:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/guild-conductor:latest
