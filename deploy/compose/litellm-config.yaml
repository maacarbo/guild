# LiteLLM gateway config — Guild Tier 1 dev stack.
#
# Every agent CLI is pointed at this proxy (ANTHROPIC_BASE_URL) and
# authenticates with a LiteLLM virtual key, never a provider key. Virtual keys
# are minted per engagement with `max_budget` (integer-cents cap upstream in
# Guild; dollars here — LiteLLM's unit). Budget exhaustion returns HTTP 429
# `budget_exceeded` (verified against LiteLLM docs/tests, 2026-07-30); spend
# writes are batched (~60s window), so treat the cap as insurance, not a
# precision cutoff — matches ARCHITECTURE.md D2.
#
# Model names are what Multica agents are configured with; Claude Code passes
# them through as-is. `or-` entries are the OpenRouter-backed fallback used
# when no ANTHROPIC_API_KEY is available; the capability matrix records which
# backend served each probe.

model_list:
  # Anthropic direct (requires ANTHROPIC_API_KEY in the gateway env)
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # Dated IDs Claude Code 2.1.x requests for its default/small-model calls
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # OpenRouter routes (require OPENROUTER_API_KEY in the gateway env) — the
  # recommended default: one key reaches Claude AND the cheap testing tier.
  - model_name: or-claude-sonnet-5
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: or-claude-haiku-4-5
    litellm_params:
      model: openrouter/anthropic/claude-haiku-4.5
      api_key: os.environ/OPENROUTER_API_KEY
  # Cheap testing tier (slugs + prices verified live 2026-07-31): use these
  # for probes, doctor checks, and demo dry-runs — 4-25x cheaper than Haiku.
  - model_name: or-deepseek-v3-2
    litellm_params:
      model: openrouter/deepseek/deepseek-v3.2
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: or-gemini-flash-lite
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-lite
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  # Virtual keys + spend live in the stack-local Postgres (litellm-postgres).
  store_model_in_db: false
