# LiteLLM gateway config — Guild Tier 1 dev stack.
#
# Every agent CLI is pointed at this proxy (OpenCode's baked provider config,
# docker/daemon/opencode.json) and
# authenticates with a LiteLLM virtual key, never a provider key. Virtual keys
# are minted per engagement with `max_budget` (integer-cents cap upstream in
# Guild; dollars here — LiteLLM's unit). Budget exhaustion returns HTTP 429
# `budget_exceeded` (verified against LiteLLM docs/tests, 2026-07-30); spend
# writes are batched (~60s window), so treat the cap as insurance, not a
# precision cutoff — matches ARCHITECTURE.md D2.
#
# Model names are what Multica agents are configured with (OpenCode uses the
# `litellm/`-qualified form). `or-` entries are the OpenRouter-backed fallback
# used when no ANTHROPIC_API_KEY is available; the capability matrix records
# which backend served each probe.

model_list:
  # Anthropic direct (requires ANTHROPIC_API_KEY in the gateway env)
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # OpenRouter routes (require OPENROUTER_API_KEY in the gateway env) — the
  # recommended default: one key reaches Claude AND the cheap testing tier.
  - model_name: or-claude-sonnet-5
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: or-claude-haiku-4-5
    litellm_params:
      model: openrouter/anthropic/claude-haiku-4.5
      api_key: os.environ/OPENROUTER_API_KEY
  # Cheap testing tier: probes, doctor checks, demo dry-runs, and — since
  # 2026-08-16 (operator directive: guild setup runs on the cheapest
  # VALIDATED agentic tier) — the setup/smoke default. Slugs + prices
  # verified live 2026-08-16 against the OpenRouter models API:
  #   qwen3-coder-30b-a3b-instruct  $0.07/M in  $0.28/M out  (~4x under DeepSeek)
  #   glm-4.7-flash                 $0.06/M in  $0.40/M out  (fallback candidate)
  #   deepseek-v3.2                 $0.27/M in  $0.40/M out  (previous default)
  # gemini-2.5-flash-lite is cheapest but FLOORED for engagement work
  # (2026-08-16: tasks execute yet the model abandons the tool loop) — doctor
  # and conformance probes only.
  - model_name: or-qwen3-coder-30b
    litellm_params:
      model: openrouter/qwen/qwen3-coder-30b-a3b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: or-glm-4-7-flash
    litellm_params:
      model: openrouter/z-ai/glm-4.7-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: or-deepseek-v3-2
    litellm_params:
      model: openrouter/deepseek/deepseek-v3.2
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: or-gemini-flash-lite
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-lite
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  # Virtual keys + spend live in the stack-local Postgres (litellm-postgres).
  store_model_in_db: false
