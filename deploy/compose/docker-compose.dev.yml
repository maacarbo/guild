# Dev override: the HOST-side harness (pnpm smoke / smoke:m2a / smoke:m2b and
# the *.live.test.ts suites) runs a conductor on the host and needs the
# governance DB on loopback. The base file keeps databases stack-internal
# (security floor) — this mapping exists ONLY under the dev override:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Never use this override on a stack reachable beyond 127.0.0.1.
services:
  guild-postgres:
    ports:
      - "127.0.0.1:5442:5432"
    # Publishing needs a non-internal attachment (#57): the base file keeps
    # this DB on guild-data alone. The publish rides a dev-only harness
    # network — NEVER guild-dev, which would hand the daemon its DB route
    # back (live-proven 2026-08-16: dual-homing onto guild-dev made
    # guild-postgres daemon-reachable again).
    networks: [guild-data, guild-harness]

networks:
  # loopback-publish carrier for the host harness; no other service joins it
  guild-harness:
    name: guild-harness
