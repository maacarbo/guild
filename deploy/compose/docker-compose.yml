# Guild Tier 1 dev/quickstart stack — Docker Compose (docs: deploy/README.md, docs/ROADMAP.md M1)
#
# Fully isolated: every service below is owned by this stack; nothing points at
# pre-existing infrastructure. All host ports bind to 127.0.0.1 only (Docker
# bypasses host firewalls; see upstream docker-compose.selfhost.yml for why).
#
# Pinned versions (bump = lockstep pair with docker/daemon image; run the
# conformance suite green before either moves — docker/daemon/README.md):
#   Multica control plane  v0.4.15   (LICENSE diff reviewed — see README.md here)
#   LiteLLM                v1.94.0   (by digest)
#
# Usage:
#   cp .env.example .env   # fill in secrets — see README.md
#   docker compose up -d                        # control plane + gateway
#   docker compose --profile daemon up -d       # after a daemon token is minted

name: guild-dev

services:
  # ---- Multica control plane (execution substrate) ------------------------
  multica-postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: multica
      POSTGRES_PASSWORD: ${MULTICA_POSTGRES_PASSWORD:?set in .env}
    volumes:
      - multica_pgdata:/var/lib/postgresql/data
    networks: [guild-data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multica -d multica"]
      interval: 5s
      timeout: 5s
      retries: 5

  multica-backend:
    image: ghcr.io/multica-ai/multica-backend:${MULTICA_VERSION:-v0.4.15}
    depends_on:
      multica-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MULTICA_BACKEND_PORT:-8080}:8080"
    volumes:
      - multica_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://multica:${MULTICA_POSTGRES_PASSWORD}@multica-postgres:5432/multica?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${MULTICA_JWT_SECRET:?set in .env}
      FRONTEND_ORIGIN: http://localhost:${MULTICA_FRONTEND_PORT:-3000}
      MULTICA_APP_URL: http://localhost:${MULTICA_FRONTEND_PORT:-3000}
      # Dev-stack login: deterministic verification code, scriptable first user.
      # NEVER expose this stack beyond 127.0.0.1 with these two set — anyone
      # who knows an email address could log in with the fixed code.
      APP_ENV: ${MULTICA_APP_ENV:-development}
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-}
      ALLOW_SIGNUP: ${MULTICA_ALLOW_SIGNUP:-true}
      MULTICA_VCS_INTEGRATION_ENABLED: "true"
      MULTICA_VCS_SECRET_KEY: ${MULTICA_VCS_SECRET_KEY:-}
    networks: [guild-dev, guild-data]
    restart: unless-stopped

  multica-frontend:
    image: ghcr.io/multica-ai/multica-web:${MULTICA_VERSION:-v0.4.15}
    depends_on: [multica-backend]
    ports:
      - "127.0.0.1:${MULTICA_FRONTEND_PORT:-3000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      REMOTE_API_URL: http://multica-backend:8080
    networks: [guild-dev]
    restart: unless-stopped

  # ---- LiteLLM gateway (all agent model traffic; budget enforcement) ------
  litellm-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:?set in .env}
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    networks: [guild-data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    # Pinned by digest: v1.94.0
    image: ghcr.io/berriai/litellm-database@sha256:528774743b9efc02ee4612e99a79810df91188689ff4e569d9bcc79216b1e906
    depends_on:
      litellm-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_POSTGRES_PASSWORD}@litellm-postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      STORE_MODEL_IN_DB: "false"
    networks: [guild-dev, guild-data]
    restart: unless-stopped

  # ---- Guild conductor database (governance state: engagements, decisions) -
  guild-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: guild
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: ${GUILD_POSTGRES_PASSWORD:?set in .env}
    # No host port, and guild-data only (#57): databases are stack-internal
    # (security floor). The host-side dev harness (pnpm smoke / live tests)
    # adds a loopback port via docker-compose.dev.yml, dual-homing this
    # service onto the dev-only guild-harness network (an internal network
    # cannot publish) — NEVER onto guild-dev, which would hand the daemon
    # its DB route back.
    volumes:
      - guild_pgdata:/var/lib/postgresql/data
    networks: [guild-data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild -d guild"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Multica agent daemon (Guild-built image; profile-gated because it
  # needs a personal access token minted from a running control plane) ------
  guild-daemon:
    profiles: [daemon]
    # Published at release tags (quickstart pulls); the build section remains
    # for development and pre-release replays (docker compose ... --build).
    image: ghcr.io/maacarbo/guild-daemon:${GUILD_IMAGE_TAG:-v0.2.0}
    build:
      context: ../../docker/daemon
      args:
        MULTICA_VERSION: ${MULTICA_VERSION:-v0.4.15}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.10}
    platform: linux/amd64
    init: true
    depends_on: [multica-backend, litellm]
    environment:
      MULTICA_SERVER_URL: http://multica-backend:8080
      MULTICA_APP_URL: http://multica-frontend:3000
      # Required at daemon start (entrypoint enforces); cannot be :?-required
      # here because compose interpolates even profile-gated services.
      # D15: this is now a NON-governance identity (daemon@guild.local), minted by
      # `guild init` — NOT the operator's own token. The conductor attributes its
      # board moves as "unknown", never "operator" (A5d fix).
      MULTICA_DAEMON_TOKEN: ${MULTICA_DAEMON_TOKEN:-}
      # Runtime rows are named "<provider> (<device_name>)"; daemon identity
      # itself is a per-container UUID in ~/.multica/daemon.id (no volume =
      # fresh identity per container, so two daemons never collide).
      MULTICA_DAEMON_DEVICE_NAME: ${MULTICA_DAEMON_DEVICE_NAME:-guild-daemon-1}
      # All model traffic through the gateway; the token is a LiteLLM virtual
      # key (never a provider key) so every call is metered and budget-capped.
      # OpenCode's baked provider config reads GUILD_DAEMON_VIRTUAL_KEY
      # directly ({env:...} in opencode.json) and targets http://litellm:4000/v1.
      GUILD_DAEMON_VIRTUAL_KEY: ${GUILD_DAEMON_VIRTUAL_KEY:-}
      # Scratch-repo git auth (HTTPS + PAT), written to an ephemeral
      # credential store by the entrypoint — never baked into the image.
      GITHUB_TOKEN: ${GUILD_DAEMON_GITHUB_TOKEN:-}
      GIT_USER_NAME: ${GUILD_DAEMON_GIT_NAME:-guild-daemon}
      GIT_USER_EMAIL: ${GUILD_DAEMON_GIT_EMAIL:-guild-daemon@localhost}
    # Session dirs are ephemeral by design (no volume): bounce continuity
    # after a container restart is best-effort — docker/daemon/README.md.
    # Compose-era hardening floor (#21): the image runs as USER agent with no
    # setuid escalation, so no-new-privileges is safe. Limits are wider than
    # the validator sandbox's 512m/256 because this container runs OpenCode
    # plus git/build tooling for a whole engagement.
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 512
    networks: [guild-dev]
    restart: unless-stopped

  # ---- Docker socket proxy: the ONLY route to the Docker API for the
  # conductor's validator driver (a raw /var/run/docker.sock mount is
  # host-root-equivalent and forbidden - D6 Tier 1 rule). Lives on its own
  # network so agents and the daemon can never reach the Docker API.
  docker-socket-proxy:
    profiles: [conductor]
    # Pinned by digest: 0.3.0 (repo convention: third-party infra pins are immutable)
    image: tecnativa/docker-socket-proxy@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [guild-validate]
    restart: unless-stopped

  # ---- Guild conductor (M2b): the governance loop as a service ------------
  guild-conductor:
    profiles: [conductor]
    image: ghcr.io/maacarbo/guild-conductor:${GUILD_IMAGE_TAG:-v0.2.0}
    build:
      context: ../..
      dockerfile: docker/conductor/Dockerfile
    depends_on:
      multica-backend:
        condition: service_started
      litellm:
        condition: service_started
      guild-postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      GUILD_MULTICA_URL: http://multica-backend:8080
      GUILD_GATEWAY_URL: http://litellm:4000
      GUILD_POSTGRES_URL: postgres://guild:${GUILD_POSTGRES_PASSWORD}@guild-postgres:5432/guild
      # guild-init prints the five values below - see deploy/README.md
      GUILD_MULTICA_TOKEN: ${GUILD_MULTICA_TOKEN:-}
      GUILD_WORKSPACE_ID: ${GUILD_WORKSPACE_ID:-}
      GUILD_ROLE_AGENTS: ${GUILD_ROLE_AGENTS:-}
      # D15 operator allowlist: the only member ids the conductor attributes as
      # "operator". The conductor refuses to start if this is empty, includes its
      # own id, or includes GUILD_DAEMON_MEMBER_ID (the A5d guard).
      GUILD_OPERATOR_MEMBER_IDS: ${GUILD_OPERATOR_MEMBER_IDS:-}
      GUILD_DAEMON_MEMBER_ID: ${GUILD_DAEMON_MEMBER_ID:-}
      # HTTPS with the scoped git PAT embedded, e.g.
      # https://x-access-token:<PAT>@github.com/you/your-product.git
      GUILD_REPO_URL: ${GUILD_REPO_URL:-}
      GUILD_TARGET_BRANCH: ${GUILD_TARGET_BRANCH:-main}
      GUILD_PLAN_BUDGET_CENTS: ${GUILD_PLAN_BUDGET_CENTS:-300}
      # M3 hiring: the model route runtime-hired agents bind to (cheap tier, D2)
      GUILD_AGENT_MODEL: ${GUILD_AGENT_MODEL:-litellm/or-deepseek-v4-flash}
      # D17 (#6): NAME of the daemon-env var holding this project's git token
      GUILD_GIT_CRED_NAME: ${GUILD_GIT_CRED_NAME:-}
      GUILD_PROJECT_SOFT_CAP_CENTS: ${GUILD_PROJECT_SOFT_CAP_CENTS:-}
      GUILD_PROJECT_HARD_CAP_CENTS: ${GUILD_PROJECT_HARD_CAP_CENTS:-}
      GUILD_VALIDATOR_IMAGE: ${GUILD_VALIDATOR_IMAGE:-node:22-alpine}
      GUILD_VALIDATOR_WORK: /var/guild/validator-work
      GUILD_VALIDATOR_VOLUME: guild-validator-work
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    volumes:
      - validator_work:/var/guild/validator-work
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [guild-dev, guild-validate, guild-data]
    restart: unless-stopped

  # ---- One-shot CLI verbs on the conductor image (D11 scope:
  # init / demo / kill-switch; doctor below). Usage:
  #   docker compose run --rm guild-init
  #   docker compose run --rm guild-demo
  #   docker compose run --rm guild-kill
  guild-init:
    profiles: [init]
    image: ghcr.io/maacarbo/guild-conductor:${GUILD_IMAGE_TAG:-v0.2.0}
    build:
      context: ../..
      dockerfile: docker/conductor/Dockerfile
    entrypoint: ["node", "--import", "tsx", "src/bin/guild-init.ts"]
    environment:
      GUILD_MULTICA_URL: http://multica-backend:8080
      GUILD_OPERATOR_EMAIL: ${GUILD_OPERATOR_EMAIL:-operator@guild.local}
      GUILD_WORKSPACE_ID: ${GUILD_WORKSPACE_ID:-}
      GUILD_AGENT_MODEL: ${GUILD_AGENT_MODEL:-litellm/or-deepseek-v4-flash}
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-}
    networks: [guild-dev]

  guild-demo:
    profiles: [demo]
    image: ghcr.io/maacarbo/guild-conductor:${GUILD_IMAGE_TAG:-v0.2.0}
    build:
      context: ../..
      dockerfile: docker/conductor/Dockerfile
    entrypoint: ["node", "--import", "tsx", "src/bin/guild-demo.ts"]
    environment:
      GUILD_MULTICA_URL: http://multica-backend:8080
      GUILD_OPERATOR_TOKEN: ${GUILD_OPERATOR_TOKEN:-}
      GUILD_WORKSPACE_ID: ${GUILD_WORKSPACE_ID:-}
      GUILD_DEMO_BUDGET: ${GUILD_DEMO_BUDGET:-3.00}
    networks: [guild-dev]

  guild-kill:
    profiles: [kill]
    image: ghcr.io/maacarbo/guild-conductor:${GUILD_IMAGE_TAG:-v0.2.0}
    build:
      context: ../..
      dockerfile: docker/conductor/Dockerfile
    entrypoint: ["node", "--import", "tsx", "src/bin/guild-kill.ts"]
    environment:
      GUILD_MULTICA_URL: http://multica-backend:8080
      GUILD_GATEWAY_URL: http://litellm:4000
      GUILD_POSTGRES_URL: postgres://guild:${GUILD_POSTGRES_PASSWORD}@guild-postgres:5432/guild
      GUILD_MULTICA_TOKEN: ${GUILD_MULTICA_TOKEN:-}
      GUILD_WORKSPACE_ID: ${GUILD_WORKSPACE_ID:-}
      GUILD_ROLE_AGENTS: ${GUILD_ROLE_AGENTS:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      # No cap env here: the kill lock's cap is read from the store's persisted
      # enforced cap (written by the running conductor), never guild-kill's own
      # env — the two must agree or the lock can self-release (D14/A1).
    networks: [guild-dev, guild-data]

  # ---- Doctor: one-shot setup diagnostics (docker compose run --rm doctor).
  # A Linux container, so the single bash implementation serves every host OS.
  doctor:
    profiles: [doctor]
    build: ./doctor
    environment:
      MULTICA_JWT_SECRET: ${MULTICA_JWT_SECRET:-}
      MULTICA_POSTGRES_PASSWORD: ${MULTICA_POSTGRES_PASSWORD:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
      LITELLM_POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:-}
      GUILD_POSTGRES_PASSWORD: ${GUILD_POSTGRES_PASSWORD:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MULTICA_DAEMON_TOKEN: ${MULTICA_DAEMON_TOKEN:-}
      GUILD_ROLE_AGENTS: ${GUILD_ROLE_AGENTS:-}
      GUILD_DAEMON_VIRTUAL_KEY: ${GUILD_DAEMON_VIRTUAL_KEY:-}
      GUILD_DAEMON_GITHUB_TOKEN: ${GUILD_DAEMON_GITHUB_TOKEN:-}
      # so doctor [5/7] can assert the daemon identity is NOT on the allowlist (A5d)
      GUILD_OPERATOR_MEMBER_IDS: ${GUILD_OPERATOR_MEMBER_IDS:-}
    networks: [guild-dev]

networks:
  guild-dev:
    name: guild-dev
  # trust zone for the Docker API route - only the conductor and the proxy
  guild-validate:
    name: guild-validate
  # data trust zone (#57, hardening floor): every database lives ONLY here.
  # internal = no default gateway, no external route, and host publishing is
  # impossible through it — the daemon (LLM-generated code) cannot reach any
  # Postgres; reachability is now bounded by topology, not just credentials.
  guild-data:
    name: guild-data
    internal: true

volumes:
  multica_pgdata:
  multica_uploads:
  litellm_pgdata:
  guild_pgdata:
  # shared by NAME with validator sandboxes (a bind path would resolve
  # against the host, not the conductor container)
  validator_work:
    name: guild-validator-work
